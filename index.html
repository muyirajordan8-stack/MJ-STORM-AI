
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJ STORM AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #090b12;
  color: white;
}

header {
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid #252938;
}

.logo {
  font-size: 21px;
  font-weight: bold;
  color: #a78bfa;
}

.logo span {
  color: white;
}

.menu {
  color: #aaa;
  font-size: 13px;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 35px 18px 120px;
}

.welcome {
  text-align: center;
  margin: 75px 0 45px;
}

.welcome h1 {
  font-size: 34px;
  margin-bottom: 12px;
}

.welcome p {
  color: #a6aabd;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 25px;
}

.suggestion {
  background: #151a29;
  border: 1px solid #30364b;
  color: white;
  padding: 16px;
  border-radius: 13px;
  text-align: left;
  cursor: pointer;
}

.suggestion:hover {
  border-color: #8b5cf6;
}

.chat {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: min(810px, 94%);
  background: #171c2b;
  border: 1px solid #343a50;
  border-radius: 18px;
  padding: 10px;
}

.inputrow {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: 0;
  color: white;
  padding: 12px;
  font-size: 16px;
}

button {
  border: 0;
  cursor: pointer;
  border-radius: 12px;
}

#send {
  background: #8155ed;
  color: white;
  padding: 12px 19px;
  font-weight: bold;
}

.note {
  text-align: center;
  color: #85899a;
  font-size: 11px;
  margin-top: 8px;
}

#messages {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.message {
  padding: 14px;
  border-radius: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #292342;
  align-self: flex-end;
  max-width: 85%;
}

.ai {
  background: #151a29;
  align-self: stretch;
}

@media(max-width:500px) {
  .welcome h1 {
    font-size: 27px;
  }

  .suggestions {
    grid-template-columns: 1fr;
  }

  main {
    padding-top: 20px;
  }

  .welcome {
    margin: 45px 0 30px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">MJ <span>STORM AI</span></div>
  <div class="menu">YOUR AI ASSISTANT</div>
</header>

<main>

  <section class="welcome" id="welcome">
    <h1>What can I help you with?</h1>
    <p>Welcome to MJ STORM AI. Your ideas start here.</p>
  </section>

  <section class="suggestions" id="suggestions">
    <button class="suggestion"
      onclick="suggest('Explain artificial intelligence')">
      ✦ Explain something
    </button>

    <button class="suggestion"
      onclick="suggest('Help me write a website')">
      ⌘ Write code
    </button>

    <button class="suggestion"
      onclick="suggest('Give me creative ideas')">
      ✧ Creative ideas
    </button>

    <button class="suggestion"
      onclick="suggest('Help me learn something new')">
      ◈ Learn something
    </button>
  </section>

  <section id="messages"></section>

</main>

<div class="chat">
  <div class="inputrow">
    <input
      id="prompt"
      placeholder="Message MJ STORM AI..."
      autocomplete="off">

    <button id="send" onclick="sendMessage()">↑</button>
  </div>

  <div class="note">
    MJ STORM AI · Check important information
  </div>
</div>

<script>
function suggest(text) {
  document.getElementById('prompt').value = text;
  sendMessage();
}

function sendMessage() {
  const input = document.getElementById('prompt');
  const text = input.value.trim();

  if (!text) return;

  document.getElementById('welcome').style.display = 'none';
  document.getElementById('suggestions').style.display = 'none';

  const messages = document.getElementById('messages');

  const user = document.createElement('div');
  user.className = 'message user';
  user.textContent = text;
  messages.appendChild(user);

  const reply = document.createElement('div');
  reply.className = 'message ai';

  reply.textContent =
    'MJ STORM AI is ready for its AI connection. The chat interface is working, but the AI engine has not been connected yet.';

  messages.appendChild(reply);

  input.value = '';
  window.scrollTo(0, document.body.scrollHeight);
}

document.getElementById('prompt').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
